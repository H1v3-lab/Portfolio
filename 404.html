<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — Dmod</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#000;--fg:#f5f5f7;--muted:#9a9aa3;--line:#1c1c20;--line-2:#2a2a30;--ok:#7ee2a8;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--fg);font-family:"Inter Tight",system-ui,sans-serif;text-align:center}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px;opacity:.3;mask-image:radial-gradient(ellipse 60% 60% at 50% 50%,#000 20%,transparent 100%);-webkit-mask-image:radial-gradient(ellipse 60% 60% at 50% 50%,#000 20%,transparent 100%)}
.face{font-family:"JetBrains Mono",monospace;font-size:clamp(64px,14vw,120px);font-weight:500;letter-spacing:-.04em;line-height:1}
.face span{display:inline-block;animation:look 3s ease-in-out infinite}
@keyframes look{0%,100%{transform:none}25%{transform:translateX(-6px)}50%{transform:scaleY(.1)}75%{transform:translateX(6px)}}
h1{font-size:clamp(28px,5vw,44px);letter-spacing:-.05em;margin:28px 0 8px}
pre{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--muted);margin:0 0 32px;white-space:pre-wrap}
pre b{color:var(--ok);font-weight:400}
main{position:relative}
a{display:inline-flex;align-items:center;height:48px;padding:0 28px;border-radius:999px;background:var(--fg);color:#000;text-decoration:none;font-weight:500}
a:hover{background:#d8d8dc}
@media (prefers-reduced-motion:reduce){.face span{animation:none}}
</style>
</head>
<body>
<main>
  <div class="face" aria-label="0_0"><span>0</span>_<span>0</span></div>
  <h1>404 · Page introuvable</h1>
  <pre><b>dmod@Deamon</b>:~$ cd /cette-page
bash: cd: /cette-page: No such file or directory</pre>
  <a href="./">cd ~ (retour à l'accueil)</a>
</main>
</body>
</html>
