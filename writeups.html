<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Writeups — Dmod</title>
<meta name="description" content="Writeups CTF de Dominique-Savio SAKOI (Dmod) : web, crypto, forensique, reverse.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f4f4f6'/%3E%3Ctext x='32' y='42' font-family='monospace' font-size='26' font-weight='700' text-anchor='middle' fill='%23050506'%3E0_0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/style.css?v=8692080140">
<style>
/* Writeups page: top bar + list of CTFs (each with its writeups) + markdown reader */
main{margin-left:0}
section{padding-block:40px 80px}
.wbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px max(clamp(16px,5vw,72px),calc((100% - 1040px)/2));background:rgba(0,0,0,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wbar a{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;color:#dcdce0}
.wbar a:hover{color:var(--fg)}
.wbar svg{width:16px;height:16px}
.wlogo{font-family:var(--mono);font-weight:600;letter-spacing:-.04em;background:var(--fg);color:var(--bg);border-radius:8px;padding:2px 8px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:-16px 0 36px}
.filters button{font-family:var(--mono);font-size:12.5px;color:#cfcfd4;background:transparent;border:1px solid var(--line-2);border-radius:999px;padding:6px 14px;cursor:pointer}
.filters button.on{background:var(--fg);color:#000;border-color:var(--fg)}
.wctf{border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,var(--panel-2),var(--panel));padding:26px;margin-bottom:20px;scroll-margin-top:90px}
.wctf:target{border-color:var(--ok);box-shadow:0 0 0 1px rgba(126,226,168,.25),0 20px 60px -30px rgba(126,226,168,.5)}
.wctf-h{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.wctf-h .ctf-logo{width:62px;height:62px;flex:none;display:grid;place-items:center;border-radius:14px;border:1px solid var(--line-2);background:var(--bg);font-family:var(--mono);font-weight:600;overflow:hidden}
.wctf-h .ctf-logo.on-light{background:#fff}
.wctf-h .ctf-logo img{max-width:84%;max-height:84%;object-fit:contain}
.wctf-h h2{font-family:var(--display);font-size:22px;letter-spacing:-.03em}
.wctf-h h2::before,.wctf-h h2::after{content:none}
.wctf-h p{margin:2px 0 0;color:var(--muted);font-size:14px}
.wctf-h .score{margin-left:auto}
.wlist{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.wlist a{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--bg);transition:border-color .2s,transform .2s}
.wlist a:hover{border-color:var(--muted);transform:translateX(3px)}
.wlist b{flex:1;font-weight:600;font-size:15.5px}
.wcat{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;border-radius:6px;padding:3px 8px;border:1px solid}
.wcat.web{color:#c4b5fd;border-color:rgba(167,139,250,.4)}.wcat.crypto{color:#fcd34d;border-color:rgba(251,191,36,.4)}
.wcat.forensics{color:#6ee7b7;border-color:rgba(52,211,153,.4)}.wcat.reverse{color:#f9a8d4;border-color:rgba(244,114,182,.4)}
.wcat.pwn{color:#fca5a5;border-color:rgba(248,113,113,.4)}.wcat.misc,.wcat.osint,.wcat.network{color:#7dd3fc;border-color:rgba(56,189,248,.4)}
.wdiff{font-family:var(--mono);font-size:12px;color:var(--dim)}
.wempty{margin:18px 0 0;font-family:var(--mono);font-size:13px;color:var(--dim)}
/* reader */
.reader{max-width:820px}
.reader .back{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;color:var(--muted);margin-bottom:26px;background:none;border:0;cursor:pointer;padding:0}
.reader .back:hover{color:var(--fg)}
.md{font-size:16px;line-height:1.8;color:#d4d4d9}
.md h1{font-size:clamp(28px,4vw,40px);letter-spacing:-.04em;line-height:1.15;margin:0 0 18px;color:var(--fg)}
.md h2{font-family:var(--display);font-size:24px;letter-spacing:-.03em;margin:40px 0 12px;color:var(--fg)}
.md h2::before,.md h2::after{content:none}
.md h3{font-size:19px;margin:28px 0 10px;color:var(--fg)}
.md a{color:var(--ok);text-decoration:underline;text-underline-offset:3px}
.md code{font-family:var(--mono);font-size:.88em;background:#141417;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.md pre{background:#08080a;border:1px solid var(--line);border-radius:14px;padding:18px;overflow-x:auto;line-height:1.6}
.md pre code{background:none;border:0;padding:0;font-size:13.5px;color:#cfcfd4}
.md blockquote{margin:0;padding:4px 18px;border-left:2px solid var(--ok);color:var(--muted)}
.md img{max-width:100%;border-radius:12px;border:1px solid var(--line)}
.md table{border-collapse:collapse;width:100%;font-size:14px}
.md th,.md td{border:1px solid var(--line);padding:8px 10px;text-align:left}
.md hr{border:0;border-top:1px solid var(--line);margin:36px 0}
.err{color:#ff8fa8;font-family:var(--mono);font-size:13px}
</style>
</head>
<body>
<div class="wbar">
  <a href="ctf.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg><span data-l="back">Retour aux CTF</span></a>
  <span class="wlogo" aria-label="Dmod">0_0</span>
</div>
<main>
  <section id="list">
    <div class="head"><h2>Writeups</h2><p class="lead" data-l="lead">Mes solutions de challenges CTF, compétition par compétition.</p></div>
    <div class="filters" id="filters"></div>
    <div id="ctfs"></div>
  </section>
  <section id="read" class="reader" hidden>
    <button class="back" type="button" id="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M15 6l-6 6 6 6"/></svg><span data-l="all">Tous les writeups</span></button>
    <article class="md" id="md"></article>
  </section>
  <footer>© 2026 Dmod · Dominique-Savio SAKOI</footer>
</main>
<script src="assets/vendor/marked.min.js"></script>
<script>
/* Writeups are listed in writeups/index.json. A writeup is either a local Markdown
   file ("file") rendered here, or an external link ("url") opened in a new tab.
   Routes: #<ctf-slug> scrolls to that CTF, #<ctf-slug>/<file-name> opens a writeup. */
const L={fr:{back:"Retour aux CTF",lead:"Mes solutions de challenges CTF, compétition par compétition.",all:"Tous les writeups",soon:"Writeups à venir pour cette compétition.",every:"Tout",err:"Impossible de charger ce writeup."},
         en:{back:"Back to CTFs",lead:"My CTF challenge solutions, competition by competition.",all:"All writeups",soon:"Writeups for this competition are coming soon.",every:"All",err:"Could not load this writeup."}};
let lang="fr";try{lang=localStorage.getItem("lang")||"fr"}catch(e){}
document.documentElement.lang=lang;
const t=k=>L[lang][k]||L.fr[k];
document.querySelectorAll("[data-l]").forEach(e=>e.textContent=t(e.dataset.l));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const trophy='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/></svg>';
let data={ctfs:[]},cat="all";

function renderList(){
  const cats=[...new Set(data.ctfs.flatMap(c=>c.writeups.map(w=>(w.category||"misc").toLowerCase())))].sort();
  const f=document.getElementById("filters");f.innerHTML="";
  if(cats.length>1)["all",...cats].forEach(c=>{const b=document.createElement("button");b.type="button";b.textContent=c==="all"?t("every"):c;b.className=c===cat?"on":"";b.onclick=()=>{cat=c;renderList()};f.appendChild(b)});
  document.getElementById("ctfs").innerHTML=data.ctfs.map(c=>{
    const ws=c.writeups.filter(w=>cat==="all"||(w.category||"misc").toLowerCase()===cat);
    if(cat!=="all"&&!ws.length)return"";
    const logo=c.logo?`<img src="${esc(c.logo)}" alt="">`:esc(c.name.slice(0,2));
    const light=c.logo&&!/ecowas|brctf|boroctf/.test(c.logo)?" on-light":"";
    const items=ws.map(w=>{const href=w.url?esc(w.url):`#${esc(c.slug)}/${esc(w.file.split("/").pop())}`;
      return `<li><a href="${href}"${w.url?' target="_blank" rel="noopener"':""}><span class="wcat ${esc((w.category||"misc").toLowerCase())}">${esc(w.category||"misc")}</span><b>${esc(w.title)}</b>${w.difficulty?`<span class="wdiff">${esc(w.difficulty)}</span>`:""}</a></li>`}).join("");
    const tier=c.tier?` tier-${esc(c.tier)}`:"";
    return `<article class="wctf${tier}" id="${esc(c.slug)}"><div class="wctf-h"><span class="ctf-logo${light}">${logo}</span><div><h2>${esc(c.name)}</h2><p>${esc(c.team||"")}</p></div><span class="score${c.tier?"":" muted"}">${c.tier?trophy:""}${esc(c.result||"")}</span></div>${items?`<ul class="wlist">${items}</ul>`:`<p class="wempty">${t("soon")}</p>`}</article>`}).join("");
}
async function open(slug,name){
  const c=data.ctfs.find(x=>x.slug===slug),w=c&&c.writeups.find(x=>x.file&&x.file.split("/").pop()===name);
  const md=document.getElementById("md");
  document.getElementById("list").hidden=true;document.getElementById("read").hidden=false;scrollTo(0,0);
  if(!w){md.innerHTML=`<p class="err">${t("err")}</p>`;return}
  document.title=w.title+" — Writeups — Dmod";
  try{const r=await fetch(w.file);if(!r.ok)throw 0;md.innerHTML=marked.parse(await r.text())}
  catch(e){md.innerHTML=`<p class="err">${t("err")}</p>`}
}
function route(){
  const h=decodeURIComponent(location.hash.slice(1)),[slug,file]=h.split("/");
  if(file){open(slug,file);return}
  document.title="Writeups — Dmod";
  document.getElementById("read").hidden=true;document.getElementById("list").hidden=false;
  if(slug){const el=document.getElementById(slug);if(el)el.scrollIntoView({block:"start"})}
}
document.getElementById("back").onclick=()=>{const s=location.hash.slice(1).split("/")[0];location.hash=s||""};
addEventListener("hashchange",route);
fetch("writeups/index.json").then(r=>r.json()).then(d=>{data=d;renderList();route()}).catch(()=>{document.getElementById("ctfs").innerHTML=`<p class="err">${t("err")}</p>`});
</script>
</body>
</html>
